<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <title>Redirigiendo...</title>

  <!-- Redirección inmediata -->
  <meta http-equiv="refresh" content="0; url=https://albertogarcia.vercel.app/">

  <!-- SEO -->
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://albertogarcia.vercel.app/">

  <script>
    const NEW_DOMAIN = "https://albertogarcia.vercel.app";

    const redirectTo =
      NEW_DOMAIN +
      window.location.pathname +
      window.location.search +
      window.location.hash;

    window.location.replace(redirectTo);
  </script>
</head>

<body>
  <p>
    Redirigiendo a
    <a href="https://albertogarcia.vercel.app/">
      albertogarcia.vercel.app
    </a>
  </p>
</body>
</html>
